<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#08080a}
  .card{position:relative;width:1200px;height:630px;overflow:hidden}
  .tape{position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(135deg,#ff6a00 0 15px,#0a0a0b 15px 30px);z-index:4}
  .glow{position:absolute;inset:0;background:
    radial-gradient(760px 460px at 86% 116%,rgba(255,106,0,.30),transparent 62%),
    radial-gradient(560px 340px at 4% -24%,rgba(255,176,0,.10),transparent 60%);}
  .grid{position:absolute;inset:0;opacity:.45;background-image:
    linear-gradient(rgba(245,242,234,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(245,242,234,.06) 1px,transparent 1px);
    background-size:86px 86px;
    -webkit-mask-image:radial-gradient(ellipse 80% 80% at 38% 50%,#000 20%,transparent 82%);
    mask-image:radial-gradient(ellipse 80% 80% at 38% 50%,#000 20%,transparent 82%);}
  .bigmark{position:absolute;right:-150px;top:96px;width:590px;height:590px;opacity:.10;transform:rotate(14deg);z-index:1}
  .wrap{position:relative;z-index:3;padding:42px 62px 0}
  .brand{display:flex;align-items:center;gap:14px}
  .brand svg{width:42px;height:42px}
  .brand span{font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:.22em;color:#f5f2ea;text-transform:uppercase;line-height:1}
  .brand em{display:block;font-style:normal;font-size:10px;letter-spacing:.3em;color:#8a857b;margin-top:6px}
  h1{font-family:"Inter Tight",sans-serif;font-weight:800;font-size:126px;line-height:.86;letter-spacing:-.048em;color:#f5f2ea;text-transform:uppercase;margin:30px 0 0}
  h1 span{background:linear-gradient(115deg,#ffb000 0%,#ff6a00 46%,#e0242e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .deck{font-family:"Inter",sans-serif;font-size:39px;line-height:1.32;color:#a09b90;margin-top:22px;letter-spacing:-.015em}
  .deck b{display:block;color:#f5f2ea;font-weight:600;letter-spacing:-.02em}
  .deck b i{font-style:normal;color:#ff6a00}
  .foot{position:absolute;left:62px;bottom:26px;z-index:3;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.24em;color:#6d685f;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="tape"></div>
  <div class="glow"></div>
  <div class="grid"></div>
  <svg class="bigmark" viewBox="0 0 120 120" aria-hidden="true">
    <defs><linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="120" y2="0">
      <stop offset="0" stop-color="#ffb000"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e0242e"/>
    </linearGradient></defs>
    <g fill="none" stroke="url(#bg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path id="bp" d="M60 60C52 38 54 20 68 12C82 24 80 44 60 60Z"/>
      <use href="#bp" transform="rotate(60 60 60)"/><use href="#bp" transform="rotate(120 60 60)"/>
      <use href="#bp" transform="rotate(180 60 60)"/><use href="#bp" transform="rotate(240 60 60)"/>
      <use href="#bp" transform="rotate(300 60 60)"/>
    </g>
  </svg>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="120" y2="0">
          <stop offset="0" stop-color="#ffb000"/><stop offset=".5" stop-color="#ff6a00"/><stop offset="1" stop-color="#e0242e"/>
        </linearGradient></defs>
        <g fill="none" stroke="url(#g)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
          <path id="p" d="M60 60C52 38 54 20 68 12C82 24 80 44 60 60Z"/>
          <use href="#p" transform="rotate(60 60 60)"/><use href="#p" transform="rotate(120 60 60)"/>
          <use href="#p" transform="rotate(180 60 60)"/><use href="#p" transform="rotate(240 60 60)"/>
          <use href="#p" transform="rotate(300 60 60)"/>
        </g><circle cx="60" cy="60" r="2.8" fill="#ff6a00"/>
      </svg>
      <span>Shirudo<em>Field report</em></span>
    </div>
    <h1>The hidden<br><span>risks of</span><br>Shirudo</h1>
    <div class="deck">OpenAI and Cisco built an AI shield<b>with <i>no off switch.</i></b></div>
  </div>
  <div class="foot">Independent security review · 24 Nov 2026</div>
</div>
</body>
</html>
